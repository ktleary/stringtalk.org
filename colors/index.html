<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Material Colors — Stringtalk</title>
<meta name="description" content="Material Design color palette with one-click copy in HEX, RGB, or HSL. Dark/light aware." />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0e12" />
<link rel="icon" href="../favicon.ico" />
<style>
  :root {
    --bg: #f0f2f3; --card: #ffffff; --fg: #1c2630; --muted: #5c6b77;
    --accent: #a87414; --accent-soft: #f3ead6; --border: #d9dee2; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html[data-theme="dark"] {
    --bg: #0a0e12; --card: #10161c; --fg: #c9d4dd; --muted: #5c6b77;
    --accent: #e8b34b; --accent-soft: #1c2630; --border: #1c2630;
  }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme]) { --bg: #0a0e12; --card: #10161c; --fg: #c9d4dd; --muted: #5c6b77;
      --accent: #e8b34b; --accent-soft: #1c2630; --border: #1c2630; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 760px; margin-inline: auto; padding: 40px 16px 80px;
  }
  a { color: inherit; text-decoration: none; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
  .brand svg { color: var(--accent); flex: none; }
  #theme-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color .15s ease, border-color .15s ease;
  }
  #theme-btn:hover { color: var(--accent); border-color: var(--accent); }
  h1 { font-size: 1.6rem; margin: 0 0 8px; font-weight: 650; letter-spacing: -0.02em; }
  .lede { color: var(--muted); margin: 0 0 24px; max-width: 50ch; }
  .bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  #search {
    flex: 1 1 180px; font: 14px var(--mono); color: var(--fg); background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px;
  }
  #search:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .seg button {
    border: 0; background: transparent; color: var(--muted); font: 600 13px var(--mono);
    padding: 9px 14px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .hue { margin-bottom: 10px; }
  .hue-head {
    font: 600 13px var(--mono); margin: 14px 2px 8px; display: flex; justify-content: space-between;
  }
  .hue-head .count { color: var(--muted); font-weight: 400; }
  .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
  .sw {
    border: 0; padding: 0; cursor: pointer; border-radius: 8px; overflow: hidden;
    height: 64px; position: relative; transition: transform .1s ease;
    font: 10.5px/1.2 var(--mono); text-align: left;
  }
  .sw:hover { transform: translateY(-2px); }
  .sw .shade { position: absolute; left: 7px; bottom: 5px; font-weight: 700; }
  .sw .hex { position: absolute; left: 7px; top: 5px; opacity: .85; }
  .sw.copied::after {
    content: "copied"; position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; background: rgba(0,0,0,.55); color: #fff;
    font: 700 12px var(--mono); border-radius: 8px;
  }
  .empty { color: var(--muted); font: 14px var(--mono); padding: 24px 0; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--fg); color: var(--bg); font: 600 13px var(--mono);
    padding: 10px 18px; border-radius: 999px; transition: transform .2s ease; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .footer {
    margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 13px; font-family: var(--mono);
    display: flex; justify-content: space-between;
  }
  .footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <div class="top">
    <a class="brand" href="/">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6c6 4 10 8 16 12"/><path d="M4 6l2.5-2M4 6l2 2.8M20 18l-2.5 2M20 18l-2-2.8"/></svg>
      Stringtalk
    </a>
    <button id="theme-btn" aria-label="Toggle theme" title="Theme: system">
      <svg id="icon-system" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 000 18z" fill="currentColor" stroke="none"/></svg>
      <svg id="icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" hidden><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
      <svg id="icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" hidden><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12h2.5M19 12h2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
    </button>
  </div>

  <h1>Material Colors</h1>
  <p class="lede">Click any shade to copy it. 500 shades are the Material defaults.</p>

  <div class="bar">
    <input id="search" placeholder="filter: blue, amber, a700 …" autocomplete="off" spellcheck="false" />
    <div class="seg" role="group" aria-label="Copy format">
      <button data-fmt="hex" aria-pressed="true">HEX</button>
      <button data-fmt="rgb" aria-pressed="false">RGB</button>
      <button data-fmt="hsl" aria-pressed="false">HSL</button>
    </div>
  </div>

  <div id="out"></div>

  <div class="footer">
    <span>GPL-3.0 · no ads · no tracking</span>
    <a href="https://github.com/ktleary/stringtalk.org">source</a>
  </div>
  <div class="toast" id="toast"></div>

<script>
// ---- theme (stringtalk family behavior) ----
(() => {
  const root = document.documentElement, btn = document.getElementById('theme-btn');
  const icons = { system: document.getElementById('icon-system'),
                  dark: document.getElementById('icon-dark'),
                  light: document.getElementById('icon-light') };
  const next = { system: 'dark', dark: 'light', light: 'system' };
  const modes = ['system', 'dark', 'light'];
  let mode = localStorage.getItem('st-theme');
  if (!modes.includes(mode)) mode = 'system';
  const apply = (m) => {
    mode = m;
    if (m === 'system') root.removeAttribute('data-theme'); else root.dataset.theme = m;
    for (const [k, el] of Object.entries(icons)) el.hidden = k !== m;
    btn.title = `Theme: ${m}`;
  };
  apply(mode);
  btn.addEventListener('click', () => { apply(next[mode]); localStorage.setItem('st-theme', mode); });
})();

const PALETTE = {"red": {"50": "#ffebee", "100": "#ffcdd2", "200": "#ef9a9a", "300": "#e57373", "400": "#ef5350", "500": "#f44336", "600": "#e53935", "700": "#d32f2f", "800": "#c62828", "900": "#b71c1c", "a100": "#ff8a80", "a200": "#ff5252", "a400": "#ff1744", "a700": "#d50000"}, "pink": {"50": "#fce4ec", "100": "#f8bbd0", "200": "#f48fb1", "300": "#f06292", "400": "#ec407a", "500": "#e91e63", "600": "#d81b60", "700": "#c2185b", "800": "#ad1457", "900": "#880e4f", "a100": "#ff80ab", "a200": "#ff4081", "a400": "#f50057", "a700": "#c51162"}, "purple": {"50": "#f3e5f5", "100": "#e1bee7", "200": "#ce93d8", "300": "#ba68c8", "400": "#ab47bc", "500": "#9c27b0", "600": "#8e24aa", "700": "#7b1fa2", "800": "#6a1b9a", "900": "#4a148c", "a100": "#ea80fc", "a200": "#e040fb", "a400": "#d500f9", "a700": "#aa00ff"}, "deep-purple": {"50": "#ede7f6", "100": "#d1c4e9", "200": "#b39ddb", "300": "#9575cd", "400": "#7e57c2", "500": "#673ab7", "600": "#5e35b1", "700": "#512da8", "800": "#4527a0", "900": "#311b92", "a100": "#b388ff", "a200": "#7c4dff", "a400": "#651fff", "a700": "#6200ea"}, "indigo": {"50": "#e8eaf6", "100": "#c5cae9", "200": "#9fa8da", "300": "#7986cb", "400": "#5c6bc0", "500": "#3f51b5", "600": "#3949ab", "700": "#303f9f", "800": "#283593", "900": "#1a237e", "a100": "#8c9eff", "a200": "#536dfe", "a400": "#3d5afe", "a700": "#304ffe"}, "blue": {"50": "#e3f2fd", "100": "#bbdefb", "200": "#90caf9", "300": "#64b5f6", "400": "#42a5f5", "500": "#2196f3", "600": "#1e88e5", "700": "#1976d2", "800": "#1565c0", "900": "#0d47a1", "a100": "#82b1ff", "a200": "#448aff", "a400": "#2979ff", "a700": "#2962ff"}, "light-blue": {"50": "#e1f5fe", "100": "#b3e5fc", "200": "#81d4fa", "300": "#4fc3f7", "400": "#29b6f6", "500": "#03a9f4", "600": "#039be5", "700": "#0288d1", "800": "#0277bd", "900": "#01579b", "a100": "#80d8ff", "a200": "#40c4ff", "a400": "#00b0ff", "a700": "#0091ea"}, "cyan": {"50": "#e0f7fa", "100": "#b2ebf2", "200": "#80deea", "300": "#4dd0e1", "400": "#26c6da", "500": "#00bcd4", "600": "#00acc1", "700": "#0097a7", "800": "#00838f", "900": "#006064", "a100": "#84ffff", "a200": "#18ffff", "a400": "#00e5ff", "a700": "#00b8d4"}, "teal": {"50": "#e0f2f1", "100": "#b2dfdb", "200": "#80cbc4", "300": "#4db6ac", "400": "#26a69a", "500": "#009688", "600": "#00897b", "700": "#00796b", "800": "#00695c", "900": "#004d40", "a100": "#a7ffeb", "a200": "#64ffda", "a400": "#1de9b6", "a700": "#00bfa5"}, "green": {"50": "#e8f5e9", "100": "#c8e6c9", "200": "#a5d6a7", "300": "#81c784", "400": "#66bb6a", "500": "#4caf50", "600": "#43a047", "700": "#388e3c", "800": "#2e7d32", "900": "#1b5e20", "a100": "#b9f6ca", "a200": "#69f0ae", "a400": "#00e676", "a700": "#00c853"}, "light-green": {"50": "#f1f8e9", "100": "#dcedc8", "200": "#c5e1a5", "300": "#aed581", "400": "#9ccc65", "500": "#8bc34a", "600": "#7cb342", "700": "#689f38", "800": "#558b2f", "900": "#33691e", "a100": "#ccff90", "a200": "#b2ff59", "a400": "#76ff03", "a700": "#64dd17"}, "lime": {"50": "#f9fbe7", "100": "#f0f4c3", "200": "#e6ee9c", "300": "#dce775", "400": "#d4e157", "500": "#cddc39", "600": "#c0ca33", "700": "#afb42b", "800": "#9e9d24", "900": "#827717", "a100": "#f4ff81", "a200": "#eeff41", "a400": "#c6ff00", "a700": "#aeea00"}, "yellow": {"50": "#fffde7", "100": "#fff9c4", "200": "#fff59d", "300": "#fff176", "400": "#ffee58", "500": "#ffeb3b", "600": "#fdd835", "700": "#fbc02d", "800": "#f9a825", "900": "#f57f17", "a100": "#ffff8d", "a200": "#ffff00", "a400": "#ffea00", "a700": "#ffd600"}, "amber": {"50": "#fff8e1", "100": "#ffecb3", "200": "#ffe082", "300": "#ffd54f", "400": "#ffca28", "500": "#ffc107", "600": "#ffb300", "700": "#ffa000", "800": "#ff8f00", "900": "#ff6f00", "a100": "#ffe57f", "a200": "#ffd740", "a400": "#ffc400", "a700": "#ffab00"}, "orange": {"50": "#fff3e0", "100": "#ffe0b2", "200": "#ffcc80", "300": "#ffb74d", "400": "#ffa726", "500": "#ff9800", "600": "#fb8c00", "700": "#f57c00", "800": "#ef6c00", "900": "#e65100", "a100": "#ffd180", "a200": "#ffab40", "a400": "#ff9100", "a700": "#ff6d00"}, "deep-orange": {"50": "#fbe9e7", "100": "#ffccbc", "200": "#ffab91", "300": "#ff8a65", "400": "#ff7043", "500": "#ff5722", "600": "#f4511e", "700": "#e64a19", "800": "#d84315", "900": "#bf360c", "a100": "#ff9e80", "a200": "#ff6e40", "a400": "#ff3d00", "a700": "#dd2c00"}, "brown": {"50": "#efebe9", "100": "#d7ccc8", "200": "#bcaaa4", "300": "#a1887f", "400": "#8d6e63", "500": "#795548", "600": "#6d4c41", "700": "#5d4037", "800": "#4e342e", "900": "#3e2723"}, "grey": {"50": "#fafafa", "100": "#f5f5f5", "200": "#eeeeee", "300": "#e0e0e0", "400": "#bdbdbd", "500": "#9e9e9e", "600": "#757575", "700": "#616161", "800": "#424242", "900": "#212121"}, "blue-grey": {"50": "#eceff1", "100": "#cfd8dc", "200": "#b0bec5", "300": "#90a4ae", "400": "#78909c", "500": "#607d8b", "600": "#546e7a", "700": "#455a64", "800": "#37474f", "900": "#263238"}};
const SHADE_ORDER = ["50","100","200","300","400","500","600","700","800","900","a100","a200","a400","a700"];
const state = { fmt: 'hex', filter: '' };

// relative luminance -> readable label color on each swatch
function textOn(hex) {
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return lum > 0.45 ? '#1c2630' : '#f0f2f3';
}
function hexToRgb(hex) {
  return [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
}
function hexToHsl(hex) {
  let [r, g, b] = hexToRgb(hex).map((v) => v / 255);
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0, s = 0, l = (max + min) / 2;
  if (d) {
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
}
function fmt(hex) {
  if (state.fmt === 'hex') return hex;
  if (state.fmt === 'rgb') { const [r, g, b] = hexToRgb(hex); return `rgb(${r}, ${g}, ${b})`; }
  const [h, s, l] = hexToHsl(hex); return `hsl(${h}, ${s}%, ${l}%)`;
}

function render() {
  const out = document.getElementById('out');
  const f = state.filter.toLowerCase();
  let html = '';
  let shown = 0;
  for (const [hue, shades] of Object.entries(PALETTE)) {
    const rows = SHADE_ORDER.filter((s) => shades[s] &&
      (!f || hue.includes(f) || s.includes(f)));
    if (!rows.length) continue;
    shown += rows.length;
    html += `<section class="hue"><div class="hue-head">${hue}<span class="count">${rows.length} shades</span></div><div class="row">`;
    for (const s of rows) {
      const hex = shades[s];
      const fg = textOn(hex);
      html += `<button class="sw" data-hue="${hue}" data-shade="${s}" style="background:${hex};color:${fg}" aria-label="copy ${hue} ${s}">
        <span class="hex">${state.fmt === 'hex' ? hex : fmt(hex)}</span>
        <span class="shade">${s === '500' ? s + ' ★' : s}</span>
      </button>`;
    }
    html += `</div></section>`;
  }
  out.innerHTML = html || '<p class="empty">no shades match that filter</p>';
}

const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
}

document.getElementById('out').addEventListener('click', async (e) => {
  const sw = e.target.closest('.sw');
  if (!sw) return;
  const { hue, shade } = sw.dataset;
  const value = fmt(PALETTE[hue][shade]);
  try { await navigator.clipboard.writeText(value); } catch {
    const ta = Object.assign(document.createElement('textarea'), { value });
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  sw.classList.add('copied');
  setTimeout(() => sw.classList.remove('copied'), 900);
  showToast(`${hue} ${shade} → ${value}`);
});

document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
  state.fmt = b.dataset.fmt;
  document.querySelectorAll('.seg button').forEach((x) =>
    x.setAttribute('aria-pressed', String(x === b)));
  render();
}));
document.getElementById('search').addEventListener('input', (e) => {
  state.filter = e.target.value.trim();
  render();
});

render();
</script>
</body>
</html>
